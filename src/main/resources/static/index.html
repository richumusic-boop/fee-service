<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCloud Banking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <h1>OpenCloud Banking</h1>
                <span class="status">Online</span>
            </div>
            <div class="avatar">
                OC
            </div>
        </header>

        <main class="chat-window" id="chat-window">
            <div class="message system">
                <div class="msg-content">Welcome to OpenCloud Banking! How can I assist you today?</div>
            </div>
        </main>

        <footer class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Ask about your balance, transactions..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="quick-actions">
                <button class="action-btn" data-query="What is my balance?">Balance</button>
                <button class="action-btn" data-query="Show me my recent transactions">Transactions</button>
                <button class="action-btn" data-query="Transfer money">Transfer</button>
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
